name: Build APK

# Запускается при каждой загрузке изменений и вручную (вкладка Actions → Build APK → Run workflow)
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Сборка APK
        run: gradle :app:assembleDebug --stacktrace

      # Автопроверки правил: если упадут, APK всё равно будет приложен
      - name: Автопроверки
        run: gradle :app:testDebugUnitTest
        continue-on-error: true

      - name: Приложить APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSorter-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
